version: "3.9"

services:
  mariadb:
    image: mariadb:10.6 # ✅ Use official image instead of build unless you have a custom Dockerfile
    container_name: mariadb_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: goal_app
      MYSQL_USER: santosh
      MYSQL_PASSWORD: mygoalapp123
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin_container
    restart: always
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: santosh
      PMA_PASSWORD: mygoalapp123
    ports:
      - "8080:80"
    depends_on:
      - mariadb

volumes:
  db_data:
